name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional:
    name: tiêu đề Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test .github/scripts/pr-title.node-test.mjs
      # Tiêu đề đi qua biến môi trường, không nội suy thẳng vào lệnh shell (chống chèn lệnh).
      - run: node .github/scripts/pr-title.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
